<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu ingresso • SUBMERSOS</title><style>body{margin:0;background:#020b14;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}.box{width:min(620px,100%);text-align:center;border:1px solid #7d6739;border-radius:20px;padding:30px;background:#0b1824;box-sizing:border-box}h1{color:#d8b568;letter-spacing:3px}p{color:#cbd2d8;line-height:1.6}.ticket{margin:20px 0;padding:22px;border:1px solid rgba(216,181,104,.35);border-radius:16px;background:rgba(0,0,0,.15)}img{width:min(320px,85vw);background:#fff;padding:10px;border-radius:12px}.muted{font-size:13px;color:#8995a0}.error{color:#f0b4b4}.btn{display:inline-block;margin-top:14px;padding:13px 20px;border-radius:10px;background:#d8b568;color:#071018;text-decoration:none;font-weight:800}</style></head><body><main class="box"><div style="letter-spacing:4px;color:#d8b568">CONFERÊNCIA DE JOVENS</div><h1>SUBMERSOS</h1><p>Profundidade, constância e intimidade eterna</p><div id="content" class="ticket">Carregando seu ingresso…</div></main><script>const ref=new URLSearchParams(location.search).get('ref');const box=document.getElementById('content');if(!ref){box.innerHTML='<p class="error">Ingresso não encontrado.</p>';}else{fetch('/api/ingresso?ref='+encodeURIComponent(ref)).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível carregar o ingresso.');box.innerHTML='<h2>'+d.nome.replace(/</g,'&lt;')+'</h2><p><strong>Camiseta:</strong> '+d.camiseta+'</p><img src="'+d.qr_url+'" alt="QR Code do ingresso"><p class="muted">Apresente este QR Code no check-in.</p><a class="btn" href="'+d.checkin_url+'">Abrir página de check-in</a>';}).catch(e=>box.innerHTML='<p class="error">'+e.message+'</p><a class="btn" href="index.html">Voltar ao site</a>');}</script></body></html>
